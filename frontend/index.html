<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>國際新聞中文摘要</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Noto Sans TC", sans-serif; }
    h1, h2, .serif { font-family: "Noto Serif TC", serif; }
    .card-hover { transition: transform 0.15s, box-shadow 0.15s; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
    .tab-active { background: #1d4ed8; color: #fff; }
    .tab-inactive { background: #f3f4f6; color: #374151; }
    .tab-inactive:hover { background: #e5e7eb; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-10 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-gray-900 serif">🌐 國際新聞摘要</h1>
        <p class="text-sm text-gray-400 mt-0.5">每日 06:00 更新 · 含遊戲業潛在影響分析</p>
      </div>
      <button onclick="manualRefresh()"
        class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm hover:bg-blue-800 transition-colors font-medium">
        手動更新
      </button>
    </div>

    <!-- Category tabs -->
    <div class="max-w-6xl mx-auto px-4 pb-3 flex gap-2 overflow-x-auto">
      <button onclick="setCategory('all')" data-cat="all" class="cat-btn tab-active px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap">全部</button>
      <button onclick="setCategory('international')" data-cat="international" class="cat-btn tab-inactive px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap">🌍 國際</button>
      <button onclick="setCategory('tech')" data-cat="tech" class="cat-btn tab-inactive px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap">💻 科技</button>
      <button onclick="setCategory('finance')" data-cat="finance" class="cat-btn tab-inactive px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap">📈 財經</button>
      <button onclick="setCategory('games')" data-cat="games" class="cat-btn tab-inactive px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap">🎮 遊戲業</button>
    </div>

    <!-- Date tabs -->
    <div class="max-w-6xl mx-auto px-4 pb-3 flex gap-2 overflow-x-auto" id="date-tabs"></div>
  </header>

  <!-- Main -->
  <main class="max-w-6xl mx-auto px-4 py-6">
    <div id="status" class="hidden mb-4 px-4 py-2 rounded-lg text-sm"></div>
    <div id="loading" class="text-center py-20 text-gray-400 text-lg">載入中...</div>
    <div id="news-grid" class="hidden grid gap-4 md:grid-cols-2 lg:grid-cols-3"></div>
    <div id="empty" class="hidden text-center py-20 text-gray-400">
      <p class="text-4xl mb-3">📰</p>
      <p>今日尚無新聞，請稍後或點擊手動更新</p>
    </div>
  </main>

  <footer class="text-center text-gray-400 text-xs py-6">
    來源：Reuters · BBC · Al Jazeera · TechCrunch · The Verge · Ars Technica · IGN · GamesIndustry.biz 等<br>
    已過濾紅媒 · 每日精選 40 則 · 保留近 7 天
  </footer>

  <script>
    const CATEGORY_LABELS = {
      international: "🌍 國際",
      tech: "💻 科技",
      finance: "📈 財經",
      games: "🎮 遊戲業",
    };

    let currentCategory = "all";
    let currentDate = null;

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll(".cat-btn").forEach(btn => {
        btn.className = btn.dataset.cat === cat
          ? "cat-btn tab-active px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap"
          : "cat-btn tab-inactive px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap";
      });
      loadNews();
    }

    function setDate(date) {
      currentDate = date;
      document.querySelectorAll(".date-btn").forEach(btn => {
        btn.className = btn.dataset.date === date
          ? "date-btn tab-active px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap"
          : "date-btn tab-inactive px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap";
      });
      loadNews();
    }

    async function loadDates() {
      try {
        const res = await fetch("/api/dates");
        const data = await res.json();
        const container = document.getElementById("date-tabs");
        container.innerHTML = "";

        if (!data.dates || data.dates.length === 0) return;

        if (currentDate === null) currentDate = data.dates[0];

        data.dates.forEach(date => {
          const btn = document.createElement("button");
          btn.dataset.date = date;
          btn.textContent = formatDateLabel(date);
          btn.onclick = () => setDate(date);
          btn.className = date === currentDate
            ? "date-btn tab-active px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap"
            : "date-btn tab-inactive px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap";
          container.appendChild(btn);
        });
      } catch (e) {}
    }

    function formatDateLabel(dateStr) {
      if (!dateStr) return "";
      const today = new Date().toISOString().slice(0, 10);
      const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      if (dateStr === today) return "今天";
      if (dateStr === yesterday) return "昨天";
      const d = new Date(dateStr);
      return `${d.getMonth() + 1}/${d.getDate()}`;
    }

    async function loadNews() {
      document.getElementById("loading").classList.remove("hidden");
      document.getElementById("news-grid").classList.add("hidden");
      document.getElementById("empty").classList.add("hidden");

      try {
        const params = new URLSearchParams({ category: currentCategory });
        if (currentDate) params.append("date", currentDate);
        const res = await fetch(`/api/news?${params}`);
        const data = await res.json();
        renderNews(data.articles);
      } catch (e) {
        showStatus("載入失敗，請確認後端是否正常運行", "error");
        document.getElementById("loading").classList.add("hidden");
      }
    }

    function renderNews(articles) {
      document.getElementById("loading").classList.add("hidden");
      const grid = document.getElementById("news-grid");

      if (!articles || articles.length === 0) {
        document.getElementById("empty").classList.remove("hidden");
        return;
      }

      grid.innerHTML = articles.map(a => `
        <a href="${a.url}" target="_blank" rel="noopener"
          class="card-hover bg-white rounded-xl border border-gray-200 p-5 flex flex-col gap-3 cursor-pointer">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="text-xs px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 font-medium">
              ${CATEGORY_LABELS[a.category] || a.category}
            </span>
            <span class="text-xs text-gray-400">${a.source}</span>
          </div>

          <h2 class="font-bold text-gray-900 leading-snug text-base serif">${a.title_zh || a.title_original}</h2>

          <p class="text-sm text-gray-600 leading-relaxed">${a.summary_zh || ""}</p>

          ${a.game_industry_impact ? `
          <div class="bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 mt-1">
            <p class="text-xs font-semibold text-amber-700 mb-0.5">🎮 遊戲業潛在影響</p>
            <p class="text-xs text-amber-800 leading-relaxed">${a.game_industry_impact}</p>
          </div>` : ""}

          <div class="flex items-center justify-between mt-auto pt-2 border-t border-gray-100">
            <span class="text-xs text-gray-400">${formatDate(a.fetched_at)}</span>
            <span class="text-xs text-blue-500">閱讀原文 →</span>
          </div>
        </a>
      `).join("");

      grid.classList.remove("hidden");
    }

    function formatDate(iso) {
      if (!iso) return "";
      try {
        return new Date(iso).toLocaleString("zh-TW", {
          month: "numeric", day: "numeric",
          hour: "2-digit", minute: "2-digit"
        });
      } catch { return iso; }
    }

    async function manualRefresh() {
      showStatus("更新中，請稍候...", "info");
      try {
        const res = await fetch("/api/refresh", { method: "POST" });
        const data = await res.json();
        showStatus(data.message || "更新已開始，約 1-2 分鐘後重新整理頁面", "success");
      } catch (e) {
        showStatus("更新失敗", "error");
      }
    }

    function showStatus(msg, type) {
      const el = document.getElementById("status");
      const styles = { info: "bg-blue-50 text-blue-700", success: "bg-green-50 text-green-700", error: "bg-red-50 text-red-700" };
      el.className = `mb-4 px-4 py-2 rounded-lg text-sm ${styles[type]}`;
      el.textContent = msg;
      el.classList.remove("hidden");
      if (type !== "info") setTimeout(() => el.classList.add("hidden"), 5000);
    }

    async function init() {
      await loadDates();
      loadNews();
    }

    init();
  </script>
</body>
</html>
