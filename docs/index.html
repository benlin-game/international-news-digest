: "TechCrunch", "category": "tech", "title_original": "Musk mulled handing OpenAI to his children, Altman testifies", "url": "https://techcrunch.com/2026/05/12/musk-mulled-handing-openai-to-his-children-altman-testifies/", "date": "2026-05-13", "title_zh": "阿特曼揭露：馬斯克曾盤算將OpenAI贈予子女", "summary_zh": "OpenAI執行長阿特曼作證指出，馬斯克曾認真考慮將其在OpenAI的股權轉贈給自己的孩子，這項未實現的計劃，揭示了公司早期股權規劃的複雜性。", "game_impact": "OpenAI權力結構的不確定性，可能影響遊戲業對AI工具的信賴與長期佈局，潛在增加開發者在AI技術選型上的風險考量。"}, {"source": "TechCrunch", "category": "tech", "title_original": "Anthropic warns investors against secondary platforms offering access to its shares", "url": "https://techcrunch.com/2026/05/12/anthropic-warns-investors-against-secondary-platforms-offering-access-to-its-shares/", "date": "2026-05-13", "title_zh": "Anthropic 示警投資人：慎防非官方平台提供其股權", "summary_zh": "AI 巨頭 Anthropic 提醒投資者，應提防聲稱提供其股票或股權的非官方次級平台，避免潛在詐騙並確保自身權益，強調公司尚未公開發行。", "game_impact": "此類股權詐騙警訊若頻傳，恐降低投資者對新興 AI 科技領域的信心。遊戲業仰賴 AI 發展，募資恐受波及，影響技術創新與成長。"}, {"source": "TechCrunch", "category": "tech", "title_original": "Potholes cost cities millions: This company is using AI and trucks to fix them", "url": "https://techcrunch.com/2026/05/12/potholes-cost-cities-millions-samsara-using-ai-trucks-fix/", "date": "2026-05-13", "title_zh": "AI卡車智慧修補路面坑洞，助城市擺脫數百萬維修損失", "summary_zh": "城市每年因路面坑洞耗費數百萬美元維修。一家公司運用AI演算法與自動化卡車，實現了坑洞的智慧偵測與高效修復，有望為城市節省巨額開支，並提升基礎設施維護效率。", "game_impact": "此技術為遊戲開發者帶來啟發。可將更真實的道路損壞模擬與AI修復系統融入開放世界或經營類遊戲，提升沉浸感；或應用於遊戲內AI環境動態生成。"}, {"source": "TechCrunch", "category": "tech", "title_original": "Report: Google and SpaceX in talks to put data centers into orbit", "url": "https://techcrunch.com/2026/05/12/report-google-and-spacex-in-talks-to-put-data-centers-into-orbit/", "date": "2026-05-13", "title_zh": "傳Google、SpaceX洽談合作 將資料中心送上軌道", "summary_zh": "消息指出，Google正與SpaceX洽談合作，計畫利用SpaceX技術，將資料中心部署至地球軌道，探索太空資料處理與運算新可能。", "game_impact": "有助降低全球網路延遲，提升雲端與大型多人線上遊戲體驗。亦為遊戲開發的分散式運算開啟新機遇。"}, {"source": "TechCrunch", "category": "tech", "title_original": "Everything Google announced at its Android Show, from Googlebooks to vibe-coded widgets", "url": "https://techcrunch.com/2026/05/12/everything-google-announced-at-its-android-show-from-googlebooks-to-vibe-coded-widgets/", "date": "2026-05-13", "title_zh": "Google Android大會重磅發布：從Google圖書到「氛圍主題」小工具全面解析", "summary_zh": "Google在年度Android大會上，發布了從Google圖書更新到「氛圍主題」個人化小工具等多項軟體與服務。此次發布著重展示Android系統在閱讀、介面個人化及整體用戶體驗上的進化，預期將提升跨裝置整合與互動性。", "game_impact": "更個人化的Android系統（如「氛圍主題」小工具），將提供遊戲開發者新契機。遊戲可設計專屬小工具，直觀展示進度或活動，強化玩家互動與留存，提升遊戲在主介面的曝光度。"}, {"source": "TechCrunch", "category": "tech", "title_original": "The AI legal services industry is heating up — Anthropic is getting in on the action", "url": "https://techcrunch.com/2026/05/12/the-ai-legal-services-industry-is-heating-up-anthropic-is-getting-in-on-the-action/", "date": "2026-05-13", "title_zh": "AI法律服務業競爭白熱化，Anthropic亦投入戰局", "summary_zh": "隨著AI法律服務產業競爭日趨白熱化，知名人工智慧公司Anthropic也宣布加入此領域，顯示該市場的潛力與吸引力。", "game_impact": "遊戲業可應用AI法務服務優化合約、IP保護與合規性，降低成本並提升營運效率。"}, {"source": "TechCrunch", "category": "tech", "title_original": "Google adds Gemini-powered dictation to Gboard, which could be bad news for dictation startups", "url": "https://techcrunch.com/2026/05/12/google-adds-gemini-powered-dictation-to-gboard-which-could-be-bad-news-for-dictation-startups/", "date": "2026-05-13", "title_zh": "Google Gboard 導入 Gemini 語音輸入 語音轉文字新創恐受衝擊", "summary_zh": "Google 在 Gboard 鍵盤中整合其強大 Gemini AI 語音輸入技術，大幅提升辨識準確與效率，恐對語音轉文字新創公司構成巨大競爭壓力。", "game_impact": "遊戲內語音指令將更精準，提升沉浸感與操作便利性；有助於遊戲內語音聊天轉文字，優化無障礙體驗及溝通。"}, {"source": "Bloomberg Markets", "category": "finance", "title_original": "Stocks Rise With Futures, Bonds Drop on Inflation: Markets Wrap", "url": "https://www.bloomberg.com/news/articles/2026-05-12/asian-stocks-under-pressure-as-us-inflation-rises-markets-wrap", "date": "2026-05-13", "title_zh": "通膨陰霾籠罩，債券承壓走跌，股市與期貨逆勢上揚：市場綜述", "summary_zh": "市場受通膨擔憂影響，債券價格承壓下跌，但股市與期貨表現逆勢上漲。投資人正密切關注未來經濟數據與貨幣政策走向。", "game_impact": "高通膨可能增加遊戲開發與營運成本，同時影響玩家消費力。股市上漲短期利於資金流，但長期恐面臨挑戰。"}, {"source": "Bloomberg Markets", "category": "finance", "title_original": "MSCI Removes Stocks Linked to Indonesia’s Richest From Indexes", "url": "https://www.bloomberg.com/news/articles/2026-05-12/msci-removes-stocks-linked-to-indonesia-s-richest-from-indexes", "date": "2026-05-13", "title_zh": "MSCI 將印尼首富家族相關股票剔除指數", "summary_zh": "MSCI指數近期宣布，將印尼首富家族旗下數檔股票自其全球指數中移除，此舉可能影響相關企業的投資流動與股價表現。", "game_impact": "此舉可能影響印尼市場投資信心與資金流向，恐間接衝擊當地遊戲產業募資，並影響玩家消費力。"}, {"source": "Bloomberg Markets", "category": "finance", "title_original": "India More Than Doubles Gold, Silver Tariffs to Defend Rupee", "url": "https://www.bloomberg.com/news/articles/2026-05-13/india-hikes-gold-and-silver-import-tariffs-to-protect-economy", "date": "2026-05-13", "title_zh": "印度為捍衛盧比 逾倍調升黃金白銀進口關稅", "summary_zh": "印度為捍衛盧比，宣布將黃金與白銀進口關稅翻倍調升。此舉旨在抑制貴金屬進口，減少外匯流失，以穩定本國貨幣匯率。", "game_impact": "反映印度經濟壓力，盧比匯率波動恐降低當地玩家購買力，使進口遊戲及硬體價格上升，衝擊遊戲市場成長潛力。"}, {"source": "Bloomberg Markets", "category": "finance", "title_original": "China’s Profit Outlook to Improve Further, Morgan Stanley Says", "url": "https://www.bloomberg.com/news/articles/2026-05-13/china-s-profit-outlook-to-improve-further-morgan-stanley-says", "date": "2026-05-13", "title_zh": "摩根士丹利：看好中國企業獲利前景將持續好轉", "summary_zh": "摩根士丹利報告指出，由於中國經濟回穩，企業營收與獲利預期將持續改善，市場前景轉趨樂觀。", "game_impact": "企業獲利好轉可望刺激消費，增加遊戲市場潛在玩家與付費意願。同時，中國遊戲廠商資金實力增強，有利於產品研發與全球佈局。"}, {"source": "Bloomberg Markets", "category": "finance", "title_original": "Pettis on China's Growth Woes, Global Trade Imbalances", "url": "https://www.bloomberg.com/news/videos/2026-05-13/pettis-on-china-s-growth-woes-global-trade-imbalances-video", "date": "2026-05-13", "title_zh": "佩蒂斯點評：中國增長困境與全球貿易失衡", "summary_zh": "經濟學家佩蒂斯深入分析中國經濟增長面臨的挑戰，並指出其對全球貿易失衡的深遠影響。", "game_impact": "中國經濟放緩恐導致遊戲消費支出減少、市場競爭加劇。全球貿易失衡亦增添海外發行與投資的不確定性。"}, {"source": "Bloomberg Markets", "category": "finance", "title_original": "Oil Dips After Three-Day Gain With Iran Peace Talks at Impasse", "url": "https://www.bloomberg.com/news/articles/2026-       if (d === yesterday) return "昨天";
      const [,m,day] = d.split("-");
      return `${+m}/${+day}`;
    }
    function gameImpactBlock(a) {
      if (!a.game_impact) return "";
      return `<div class="bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">
        <p class="text-xs font-semibold text-amber-700 mb-0.5">🎮 遊戲業潛在影響</p>
        <p class="text-xs text-amber-800 leading-relaxed">${a.game_impact}</p>
      </div>`;
    }
    function catBadge(a) {
      return `<span class="text-xs px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 font-medium">${LABELS[a.category]||a.category}</span>
              <span class="text-xs text-gray-400">${a.source}</span>`;
    }

    /* ── card templates ── */
    function cardCritical(a) {
      return `<a href="${a.url}" target="_blank" rel="noopener"
          class="card-t block bg-white rounded-xl border-l-4 border-blue-700 shadow-md p-5 hover:shadow-lg">
        <div class="flex items-center gap-2 flex-wrap mb-3">
          ${catBadge(a)}
          <span class="ml-auto text-xs bg-blue-700 text-white px-2 py-0.5 rounded-full font-semibold">🎯 必看</span>
        </div>
        <h2 class="serif font-bold text-gray-900 text-xl leading-snug mb-3">${a.title_zh||a.title_original}</h2>
        <p class="text-sm text-gray-600 leading-loose mb-3">${a.summary_zh||""}</p>
        ${gameImpactBlock(a)}
        <div class="flex items-center justify-between mt-3 pt-2 border-t border-gray-100">
          <span class="text-xs text-gray-400">${a.date}</span>
          <span class="text-xs text-blue-600 font-medium">閱讀原文 →</span>
        </div>
      </a>`;
    }

    function cardNormal(a) {
      return `<a href="${a.url}" target="_blank" rel="noopener"
          class="card-t bg-white rounded-xl border border-gray-200 shadow-sm p-5 flex flex-col gap-3 hover:shadow-md">
        <div class="flex items-center gap-2 flex-wrap">${catBadge(a)}</div>
        <h2 class="serif font-bold text-gray-900 text-base leading-snug">${a.title_zh||a.title_original}</h2>
        <p class="text-sm text-gray-600 leading-loose flex-1">${a.summary_zh||""}</p>
        ${gameImpactBlock(a)}
        <div class="flex items-center justify-between mt-auto pt-2 border-t border-gray-100">
          <span class="text-xs text-gray-400">${a.date}</span>
          <span class="text-xs text-blue-500">閱讀原文 →</span>
        </div>
      </a>`;
    }

    function cardBackground(a) {
      return `<a href="${a.url}" target="_blank" rel="noopener"
          class="card-t bg-white rounded-xl border border-gray-100 p-4 flex flex-col gap-2 hover:border-gray-300 hover:shadow-sm">
        <div class="flex items-center gap-2 flex-wrap">${catBadge(a)}</div>
        <h2 class="serif font-medium text-gray-500 text-sm leading-snug">${a.title_zh||a.title_original}</h2>
        <p class="text-xs text-gray-400 leading-relaxed flex-1">${a.summary_zh||""}</p>
        ${a.game_impact ? `<p class="text-xs text-amber-600 leading-relaxed">🎮 ${a.game_impact}</p>` : ""}
        <div class="flex items-center justify-between pt-1 border-t border-gray-50">
          <span class="text-xs text-gray-300">${a.date}</span>
          <span class="text-xs text-gray-400">閱讀原文 →</span>
        </div>
      </a>`;
    }

    /* ── tabs ── */
    function renderDateTabs() {
      const dates = availableDates();
      if (!currentDate || !dates.includes(currentDate)) currentDate = dates[0]||null;
      document.getElementById("date-tabs").innerHTML = dates.map(d =>
        `<button onclick="setDate('${d}')" data-date="${d}"
          class="date-btn ${d===currentDate?"tab-active":"tab-inactive"} px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap">
          ${dateLabel(d)}</button>`
      ).join("");
    }
    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll(".cat-btn").forEach(b => {
        b.className = "cat-btn "+(b.dataset.cat===cat?"tab-active":"tab-inactive")+" px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap";
      });
      render();
    }
    function setDate(date) {
      currentDate = date;
      document.querySelectorAll(".date-btn").forEach(b => {
        b.className = "date-btn "+(b.dataset.date===date?"tab-active":"tab-inactive")+" px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap";
      });
      render();
    }

    /* ── main render ── */
    function render() {
      const filtered = ALL_NEWS.filter(a =>
        (!currentDate || a.date === currentDate) &&
        (currentCategory === "all" || a.category === currentCategory)
      );

      const main = document.getElementById("main-content");
      if (!filtered.length) {
        main.innerHTML = `<div class="text-center py-20 text-gray-400"><p class="text-4xl mb-3">📰</p><p>此日期 / 分類沒有新聞</p></div>`;
        return;
      }

      const critical   = filtered.filter(a => a.importance === "critical");
      const normal     = filtered.filter(a => !a.importance || a.importance === "normal");
      const background = filtered.filter(a => a.importance === "background");

      let html = "";

      if (critical.length) {
        html += `<section>
          <p class="section-label">🎯 必看新聞</p>
          <div class="space-y-4">${critical.map(cardCritical).join("")}</div>
        </section>`;
      }
      if (normal.length) {
        html += `<section>
          <p class="section-label">📊 一般新聞</p>
          <div class="grid gap-4 md:grid-cols-2">${normal.map(cardNormal).join("")}</div>
        </section>`;
      }
      if (background.length) {
        html += `<section>
          <p class="section-label">🌏 背景新聞</p>
          <div class="grid gap-3 md:grid-cols-2 lg:grid-cols-3">${background.map(cardBackground).join("")}</div>
        </section>`;
      }

      main.innerHTML = html;
    }

    renderDateTabs();
    render();
  </script>
</body>
</html>
